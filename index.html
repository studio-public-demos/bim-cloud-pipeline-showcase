<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BIM Cloud Pipeline — Live Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>◨</text></svg>" />
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <style>
    :root {
      --bg:#0b0f17; --panel:#131a26; --panel2:#1a2333; --border:#263349;
      --text:#e6edf7; --muted:#8b98ad; --accent:#3b82f6; --accent2:#22d3ee;
      --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
    header { border-bottom:1px solid var(--border); padding:14px 20px;
      background:linear-gradient(180deg,#0e1522,#0b0f17); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .logo { display:inline-grid; place-items:center; width:36px; height:36px; border-radius:9px;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); font-size:20px; color:#06121f; font-weight:700; }
    .brand { font-size:16px; font-weight:700; } .brand em { color:var(--accent2); font-style:normal; }
    .tagline { color:var(--muted); font-size:13px; }
    main { display:grid; grid-template-columns:1.15fr .85fr; gap:16px; padding:16px 20px 40px; max-width:1280px; margin:0 auto; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .viewer { position:relative; aspect-ratio:4/3; background:radial-gradient(circle at 50% 30%,#1c2942,#0c1119); border-radius:10px; overflow:hidden; min-height:300px; }
    .viewer canvas { display:block; }
    .viewer .hint { position:absolute; left:10px; bottom:8px; font-size:11px; color:var(--muted);
      background:rgba(10,15,25,.6); padding:3px 8px; border-radius:6px; pointer-events:none; }
    .placeholder { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:14px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
    .stat .k { font-size:11.5px; color:var(--muted); } .stat .v { font-size:22px; font-weight:700; margin-top:2px; }
    h2 { font-size:15px; margin:0 0 10px; }
    .bars { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .bar-row { display:grid; grid-template-columns:90px 1fr 34px; gap:8px; align-items:center; font-size:12.5px; }
    .bar-track { background:var(--panel2); border-radius:6px; height:14px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; }
    .bar-num { color:var(--muted); text-align:right; }
    .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .chip { border:1px solid var(--border); background:var(--panel2); color:var(--muted);
      border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; min-height:32px; }
    .chip.active { background:linear-gradient(135deg,var(--accent),#2563eb); color:#fff; border-color:transparent; }
    .elements { max-height:340px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
    .el { display:grid; grid-template-columns:1fr auto; gap:8px; background:var(--panel2);
      border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12.5px; }
    .el .n { font-weight:600; } .el .m { color:var(--muted); font-size:11.5px; }
    .el .cat { color:var(--accent2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
    footer { text-align:center; padding:18px; opacity:.55; font-size:12px; border-top:1px solid var(--border); }
    footer a { color:var(--accent); text-decoration:none; }
    @media (max-width:820px) { main { grid-template-columns:1fr; padding:12px 12px 40px; } .stats { grid-template-columns:repeat(3,1fr); } }
  </style>
</head>
<body>
  <header>
    <span class="logo">◨</span>
    <span class="brand">BIM Cloud <em>Pipeline</em></span>
    <span class="tagline">Revit &amp; IFC → optimised GLB/GLTF + structured metadata · live demo</span>
  </header>

  <main>
    <section class="card">
      <h2>3D derivative — sample model (GLB)</h2>
      <div class="viewer" id="viewer">
        <div class="placeholder" id="ph">Loading model…</div>
        <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
      </div>
    </section>

    <section class="card">
      <h2>Structured metadata (JSON)</h2>
      <div class="stats" id="stats"></div>
      <div class="bars" id="bars"></div>
      <div class="filters" id="filters"></div>
      <div class="elements" id="elements"></div>
    </section>
  </main>

  <footer>
    <a href="https://nebulacloud.studio" target="_blank" rel="noopener">Built with NebulaCloud Studio</a>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const METADATA_URL = 'assets/outputs/sample-metadata.json';
    const MODEL_URL = 'assets/outputs/sample-model.glb';

    // ---- 3D viewer -------------------------------------------------------
    const container = document.getElementById('viewer');
    const ph = document.getElementById('ph');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2230, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(6,10,6); scene.add(key);
    const fill = new THREE.DirectionalLight(0x9db4d6, 0.7); fill.position.set(-5,4,-4); scene.add(fill);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();
    (function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

    new GLTFLoader().loadAsync(MODEL_URL).then((gltf) => {
      gltf.scene.traverse((o) => { if (o.isMesh) {
        o.castShadow = o.receiveShadow = true;
        if (o.geometry && o.geometry.getAttribute('color')) {
          (Array.isArray(o.material)?o.material:[o.material]).forEach(m => { m.vertexColors = true; });
        }
      }});
      scene.add(gltf.scene);
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const d = Math.max(size.x, size.y, size.z) * 1.9;
      camera.position.copy(center).add(new THREE.Vector3(1,0.8,1).normalize().multiplyScalar(d));
      controls.target.copy(center);
      ph.style.display = 'none';
    }).catch((e) => { ph.textContent = 'Could not load model: ' + e.message; });

    // ---- metadata --------------------------------------------------------
    async function renderMeta() {
      try {
        const meta = await (await fetch(METADATA_URL)).json();
        const st = meta.stats || {};
        const stats = document.getElementById('stats');
        const fmt = (n) => Number(n ?? 0).toLocaleString();
        stats.innerHTML = `
          <div class="stat"><div class="k">Elements</div><div class="v">${fmt(st.totalElements)}</div></div>
          <div class="stat"><div class="k">Triangles</div><div class="v">${fmt(st.totalTriangles)}</div></div>
          <div class="stat"><div class="k">Vertices</div><div class="v">${fmt(st.totalVertices)}</div></div>`;

        const byCat = st.byCategory || {};
        const cats = Object.keys(byCat);
        const max = Math.max(1, ...Object.values(byCat));
        document.getElementById('bars').innerHTML = cats.map((c) => `
          <div class="bar-row"><span>${c}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${(byCat[c]/max*100).toFixed(0)}%"></span></span>
            <span class="bar-num">${byCat[c]}</span></div>`).join('');

        const filters = document.getElementById('filters');
        filters.innerHTML = ['all', ...cats].map((c) =>
          `<button class="chip ${c==='all'?'active':''}" data-cat="${c}">${c === 'all' ? 'All' : c}</button>`).join('');
        filters.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
          filters.querySelectorAll('.chip').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          renderElements(meta.elements, b.dataset.cat);
        }));

        renderElements(meta.elements, 'all');
      } catch (e) {
        document.getElementById('stats').textContent = 'Metadata: ' + e.message;
      }
    }
    function renderElements(elements, cat) {
      const list = (elements || []).filter((e) => cat === 'all' || e.category === cat);
      document.getElementById('elements').innerHTML = list.map((e) => `
        <div class="el"><span><span class="n">${esc(e.name || '—')}</span>
          <span class="cat">${esc(e.category || '')}</span><br>
          <span class="m">${esc(e.material || '')}${e.containedIn ? ' · ' + esc(e.containedIn) : ''}</span></span>
          <span class="m">${esc(e.ifcType || '')}</span></div>`).join('') || '<div class="m">No elements</div>';
    }
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    renderMeta();
  </script>
</body>
</html>
