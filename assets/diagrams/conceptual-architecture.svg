<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#131a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="638" fill="none" stroke="#263349" stroke-width="2"/>

  <text x="60" y="70" fill="#e6edf7" font-size="30" font-weight="700">BIM Cloud Pipeline</text>
  <text x="60" y="102" fill="#8b98ad" font-size="16">Revit &amp; IFC → optimised GLB/GLTF + structured metadata, for web · mobile · AR/VR · digital twin</text>

  <!-- INPUT -->
  <g>
    <rect x="60" y="150" width="220" height="150" rx="14" fill="#1a2333" stroke="#263349"/>
    <text x="170" y="190" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">Input</text>
    <text x="170" y="220" fill="#e6edf7" font-size="16" text-anchor="middle">Revit  (.rvt)</text>
    <text x="170" y="248" fill="#e6edf7" font-size="16" text-anchor="middle">IFC  (.ifc)</text>
    <text x="170" y="276" fill="#8b98ad" font-size="12.5" text-anchor="middle">glTF / GLB too</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M280 225 H370" stroke="url(#accent)" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- PIPELINE -->
  <g>
    <rect x="380" y="120" width="420" height="210" rx="16" fill="#131a26" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
    <text x="590" y="152" fill="#e6edf7" font-size="16" font-weight="700" text-anchor="middle">Cloud processing pipeline</text>
    <g font-size="13" fill="#c7d2e0">
      <circle cx="415" cy="185" r="4" fill="#34d399"/><text x="430" y="189">Upload &amp; validate</text>
      <circle cx="415" cy="215" r="4" fill="#34d399"/><text x="430" y="219">Parse BIM geometry + semantics</text>
      <circle cx="415" cy="245" r="4" fill="#34d399"/><text x="430" y="249">Optimise triangle mesh (mm → m)</text>
      <circle cx="415" cy="275" r="4" fill="#34d399"/><text x="430" y="279">Extract structured metadata</text>
      <circle cx="415" cy="305" r="4" fill="#34d399"/><text x="430" y="309">Track job status + logs</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <path d="M800 225 H890" stroke="url(#accent)" stroke-width="3" marker-end="url(#a)"/>

  <!-- OUTPUT -->
  <g>
    <rect x="900" y="150" width="240" height="150" rx="14" fill="#1a2333" stroke="#263349"/>
    <text x="1020" y="190" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">Derivatives</text>
    <text x="1020" y="222" fill="#e6edf7" font-size="15.5" text-anchor="middle">model.glb / .gltf</text>
    <text x="1020" y="248" fill="#8b98ad" font-size="12.5" text-anchor="middle">optimised 3D, metres, colours</text>
    <text x="1020" y="276" fill="#e6edf7" font-size="15.5" text-anchor="middle">metadata.json</text>
  </g>

  <!-- CONSUMERS -->
  <g>
    <text x="60" y="390" fill="#8b98ad" font-size="13" font-weight="700" letter-spacing="1">POWERING DOWNSTREAM EXPERIENCES</text>
    <g font-size="13.5" fill="#e6edf7">
      <rect x="60" y="410" width="150" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="135" y="441" text-anchor="middle">Web</text>
      <rect x="225" y="410" width="150" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="300" y="441" text-anchor="middle">Mobile</text>
      <rect x="390" y="410" width="150" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="465" y="441" text-anchor="middle">AR / VR / XR</text>
      <rect x="555" y="410" width="170" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="640" y="441" text-anchor="middle">Digital twin</text>
      <rect x="740" y="410" width="190" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="835" y="441" text-anchor="middle">Real-time AEC</text>
      <rect x="945" y="410" width="195" height="52" rx="10" fill="#1a2333" stroke="#263349"/><text x="1042" y="441" text-anchor="middle">REST API consumers</text>
    </g>
  </g>

  <!-- API + VALUE -->
  <g>
    <rect x="60" y="500" width="1080" height="96" rx="12" fill="#0e1522" stroke="#263349"/>
    <text x="90" y="532" fill="#22d3ee" font-size="14" font-weight="700">ONE PIPELINE · ONE API</text>
    <text x="90" y="560" fill="#c7d2e0" font-size="13.5">Upload → process → track → download, all through a single REST API.</text>
    <text x="90" y="582" fill="#8b98ad" font-size="12.5">Real Revit conversion (Autodesk APS) and S3 cloud storage are available as credential-gated adapters.</text>
  </g>

  <text x="1140" y="620" fill="#3b82f6" font-size="12" text-anchor="end">nebulacloud.studio</text>
</svg>
